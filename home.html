<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home page</title>

    <!-- favicon add -->
   <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon"> 

   <!-- tailwind+daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- font family -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    *{
         font-family: "Outfit", sans-serif;
    }
</style>
</head>
<body class="min-h-screen max-w-md bg-[#F4F5F7] mx-auto">

    <!-- Navbar section -->
  <header class="border-b-2 border-gray-300 sticky top-0 z-10 bg-base-200">
    <section class="w-11/12 py-7 mx-auto flex justify-between items-center">
    <div class="left flex gap-1">
    <div class="w-[60px]">
        <img src="assets/logo.png" alt="">
        </div>
        <div class="balance-info">
            <h2 class="text-2xl font-bold ">$ <span id="balance">45000</span></h2>
            <p class="text-neutral/50">Available Balance</p>

        </div>
    
    </div>


    <div class="right">
     <a href="/index.html" class="btn btn-soft"> <i class="fa-solid fa-arrow-right-from-bracket"></i>Logout</a>
    </div>
    </section>
  </header>

  <!-- welcome to payoo -->
  <section class="w-11/12 mx-auto py-11">
    <h2 class="text-3xl font-bold space-y-5">Welcome to Pay<span>oo</span></h2>
     <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
     
      <!-- grid button design -->
     <div class="button grid grid-cols-3 mt-6 gap-3">
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-2.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-3.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-4.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-5.png" alt="">
            <p>Add Money</p>
        </button>
        <button class="btn flex-col h-full py-4 btn-primary btn-soft">
            <img src="assets/opt-1.png" alt="">
            <p>Add Money</p>
        </button>

     </div>

  </section>

  <!-- add money -->
   <section id="add-money w-11/12 mx-auto">
    <h2 class="text-2xl font-bold mb-5">Add money</h2>
    <div class="card bg-base-100 w-full rounded-2xl">
      <div class="card-body ">
        <fieldset class="fieldset">
          <label class="label text-neutral font-medium">Select A Bank</label>
          <!-- <input id="cashout-number" minlength="11" maxlength="11" type="text" class="input rounded-full bg-[#F4F5F7] w-full " placeholder="Select Bank " value='01916948899' /> -->

        <select id="add-money-bank" class="select w-full bg-base-200 rounded-full">
         <option disabled selected>Select A Bank</option>
        <option value="DBBl">DBBL</option>
        <option value="IBBL"> IBBL</option>
        <option value="City Bank">City bank</option>
        </select>

          <br>

          <label class="label text-neutral font-medium">Bank Account Number</label>
          <input id="add-money-number" maxlength="11" minlength="11" type="number" class="input rounded-full bg-[#F4F5F7] w-full" placeholder="Enter 11 digit account number" value="01916948899" />

         <br>
          <label class="label text-neutral font-bold">Amount to Add</label>
          <input id="add-money-amount" maxlength="11" minlength="11" type="number" class="input rounded-full bg-[#F4F5F7] w-full" placeholder="Add Amount to withdraw" />
         <br>
          <label class="label text-neutral font-medium">Pin Number</label>
          <input id="add-money-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-[#F4F5F7] w-full" placeholder="Enter 4 digit pin number" />
         
          <button id="add-money-btn" class="btn btn-neutral mt-4 rounded-full bg-[#3B25C1] font-semibold text-[#FFFFFF]">Add Money</button>
        </fieldset>
      </div>
      </div>
   </section>


    <!-- cash-out section -->
   <section class="cashout w-11/12 mx-auto hidden ">
    <h2 class="text-2xl font-bold mb-5">Cash Out</h2>
    <div class="card bg-base-100 w-full rounded-2xl">
      <div class="card-body ">
        <fieldset class="fieldset">
          <label class="label text-neutral font-medium">Agent Number</label>
          <input id="cashout-number" minlength="11" maxlength="11" type="text" class="input rounded-full bg-[#F4F5F7] w-full " placeholder="Enter 11 digit number " value='01916948899' />

          <br>

          <label class="label text-neutral font-medium">Amount</label>
          <input id="cashout-amount" maxlength="4" minlength="4" type="number" class="input rounded-full bg-[#F4F5F7] w-full" placeholder="Enter amount to withdraw" />

         <br>
          <label class="label text-neutral font-medium">Pin Number</label>
          <input id="cashout-pin" maxlength="4" minlength="4" type="password" class="input rounded-full bg-[#F4F5F7] w-full" placeholder="Enter 4 digit pin number" />
         
          <button id="cashout-btn" class="btn btn-neutral mt-4 rounded-full bg-[#3B25C1] font-semibold text-[#FFFFFF]">Withdraw Money</button>
        </fieldset>
      </div>
      </div>
   </section>

   <!-- java-script added -->
    <script src="script/machine.js"></script>
   <script src="script/cashout.js"></script>
   <script src="script/addmoney.js"></script>
</body>
</html>
