<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAY00-RESOURCES</title>

    <!-- favicon add -->
   <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon"> 

   <!-- tailwind+daisy -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- font family -->
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">

<!-- font awsome icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<style>
    *{
         font-family: "Outfit", sans-serif;
    }
</style>
</head>
<body class="min-h-screen max-w-md bg-[#F4F5F7] mx-auto">
   <div class="w-[263px] mx-auto pt-[210px]">
    <img src="assets/Logo-full.png" alt="">
   </div>

   <!-- form design with daisy UI -->
   <div class="form mt-[32px] mx-auto">
         <div class="card bg-base-100 w-full max-w-sm shrink-0  mx-auto rounded-2xl">
      <div class="card-body">
        <fieldset class="fieldset">
          <label class="label text-neutral font-medium">Mobile Number</label>
          <input minlength="11" maxlength="11" type="text" class="input rounded-full bg-[#F4F5F7] " placeholder="Enter your number" />

          <br>

          <label class="label text-neutral font-medium">4 Digit Pin</label>
          <input maxlength="4" minlength="4" type="password" class="input rounded-full bg-[#F4F5F7]" placeholder="Enter 4 Digit Pin" />
         
          <button class="btn btn-neutral mt-4 rounded-full bg-[#3B25C1] font-semibold text-[#FFFFFF]">Login</button>
        </fieldset>
      </div>
    </div>
  </div>
   </div>

   <!-- java script functionality -->
   <script src="script/login.js"></script>
</body>
</html>
